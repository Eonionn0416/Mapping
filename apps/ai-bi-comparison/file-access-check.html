<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:"><title>QA 파일 접근 진단</title><style>body{font:16px system-ui;max-width:1000px;margin:35px auto;padding:20px;color:#18324f}section{padding:20px;border:1px solid #cbd8ea;border-radius:12px;margin:18px 0}button,input{padding:10px;margin:6px;border:1px solid #bacce4;border-radius:6px}button{background:#eaf1fb;color:#18324f;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5fa;padding:16px}strong{color:#245bb1}</style>
<h1>파일 접근 진단</h1><p>Excel 분석·DB·서버 통신 없이 파일 바이트만 읽습니다. 파일 내용은 전송하거나 결과에 기록하지 않습니다.</p>
<section><strong>1. 문제가 발생하는 Chrome에서 파일 선택</strong><p>Original.xlsx를 먼저 선택한 뒤 revision.xlsx를 선택하세요.</p><label>원본<input id="original" type="file"></label><br><label>개정<input id="revision" type="file"></label><p id="verdict">파일을 선택하세요.</p></section>
<section><strong>2. 필요하면 일반 파일과 비교</strong><p>아래 버튼으로 작은 테스트 TXT를 저장한 뒤 이 칸에서 선택하세요.</p><button id="sample">테스트 TXT 저장</button><input id="control" type="file"><button id="export">진단 결과 TXT 저장</button></section><pre id="result"></pre>
<script>
const $=id=>document.getElementById(id),report={tool:'isolated-file-read-1',page:location.protocol,browser:navigator.userAgent,time:new Date().toISOString(),runs:[]},kept={};
function show(){$('result').textContent=JSON.stringify(report,null,2);const real=report.runs.filter(x=>x.side!=='memory-control');if(real.some(x=>x.ok===false))$('verdict').textContent='독립 파일 읽기에서도 실패했습니다. 이 실패는 QA 비교·DB 코드 없이 발생했습니다. 진단 결과 TXT를 전달해 주세요.';else if(real.length)$('verdict').textContent='독립 파일 읽기에 성공했습니다. QA 화면과 이 결과를 비교해 확인할 수 있습니다.';}
function reader(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsArrayBuffer(file);});}
async function test(side,file){const out={side,name:file.name,size:file.size,lastModified:file.lastModified,attempts:[]};report.runs.push(out);for(const [method,fn] of [['arrayBuffer',()=>file.arrayBuffer()],['FileReader',()=>reader(file)]]){try{const b=await fn();out.attempts.push({method,ok:true,bytes:b.byteLength});kept[side]=new Uint8Array(b);out.ok=b.byteLength===file.size;break;}catch(e){out.attempts.push({method,ok:false,name:e.name,message:e.message});out.ok=false;}}out.retainedBytes=Object.fromEntries(Object.entries(kept).map(([k,v])=>[k,v.byteLength]));show();}
for(const id of ['original','revision','control'])$(id).onchange=e=>{const f=e.target.files[0];if(f)test(id,f);};
function download(name,value){const u=URL.createObjectURL(new Blob([value],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);}
$('sample').onclick=()=>download('QA_file_read_control.txt','QA file access control test. No business data.');$('export').onclick=()=>download('QA_Isolated_File_Read.txt',JSON.stringify(report,null,2));test('memory-control',new File(['QA memory check'],'memory.txt'));
</script></html>
