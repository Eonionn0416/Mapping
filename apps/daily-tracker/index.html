<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Tracker</title><link rel="stylesheet" href="../../shared/common.css"><link rel="stylesheet" href="tracker.css?v=39"><script src="../../shared/vendor/xlsx.full.min.js"></script><script src="../../shared/catalog-core.js?v=35"></script><script src="tracker-core.js?v=35"></script><link rel="stylesheet" href="../../shared/qa-toolbar.css?v=60"></head><body><main><a href="../../index.html">← QA Page</a><header><p class="eyebrow">QA SYSTEM 10</p><h1>Daily Tracker</h1><p>고객별 Title과 On going 이슈를 확인하고, 완료 이력과 Excel Revision을 조회합니다.</p></header><section class="panel"><div class="filters qa-toolbar"><label>Report series<input id="series" value="Daily Tracker"></label><label>Excel 업데이트<input id="file" type="file" accept=".xlsx,.xls,.xlsm"></label><button id="pickFile" type="button">파일 직접 선택</button><button id="providedFile" type="button">첨부 Daily Tracker 불러오기 (10/23)</button><label>Revision 메모<input id="revisionNote" placeholder="선택 입력"></label><button id="save" disabled>새 Revision 저장</button><button id="sync">Firestore 동기화</button></div><div class="filters delete-actions"><button id="clearLocal" class="danger">Local 전체 Revision 삭제</button><button id="clearCloud" class="danger">Firestore 전체 Revision 삭제</button></div><p>각 삭제 버튼은 해당 저장소의 Daily Tracker 이력만 삭제합니다. 기본 파일 자동 등록도 중지합니다. 다른 QA 데이터는 유지합니다.</p><p id="status" role="status" aria-live="polite">저장 이력을 불러옵니다.</p><div id="preview"></div></section><section class="panel"><div class="filters"><label>저장된 Revision<select id="revision"></select></label><label>Customer<select id="customer"><option value="">All customers</option></select></label><label>Title / 내용 / Device / Lot<input id="search" type="search" placeholder="이슈 검색"></label></div><div id="metrics" class="metrics"></div><p id="revisionInfo"></p></section><div id="ongoing"></div><details class="panel"><summary id="doneCount">Done 이력</summary><div id="done"></div></details><details class="panel"><summary id="otherCount">기타 / 상태 미기재</summary><div id="other"></div></details><details class="panel"><summary>직전 Revision과 달라진 항목</summary><div id="changes"></div></details></main><script src="initial-data.js?v=35"></script><script type="module" src="tracker.js?v=46"></script><script defer src="../../shared/qa-context.js?v=35"></script></body></html>
