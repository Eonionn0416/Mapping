<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MNT Yield Trend</title><link rel="stylesheet" href="../../shared/common.css"><link rel="stylesheet" href="style.css?v=110"><script src="../../shared/vendor/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script></head><body><main><a href="../customer-quality-trend/">← Customer Quality Trend Chart</a><h1>MNT Yield Trend</h1><section id="drop" class="upload"><div><h2>보고서 업데이트</h2><p>Excel / CSV 파일을 여러 개 선택하거나 이 영역에 놓으세요.</p><div class="upload-actions"><label class="primary upload-button" tabindex="0">Excel / CSV 첨부<input id="files" type="file" accept=".csv,.xlsx,.xls" multiple hidden></label><button id="reload">Firestore 새로고침</button></div></div><div class="upload-status"><p id="status" role="status" aria-live="polite"></p></div></section><details class="report-download"><summary>첨부 보고서 다운로드</summary><div class="filters"><label>보고서<select id="reportFile"></select></label><button id="downloadReport" disabled>원본 다운로드</button></div><p id="reportStatus" role="status"></p></details><nav><button id="lotTab">Lot 통합 조회</button><button id="weeklyTab" class="active">Weekly Trend</button><button id="vmTab">VM Yield</button></nav><section id="weekly"><div class="filters"><label>From<input type="date" id="from"></label><label>To<input type="date" id="to"></label><label>PART No / PK / LEAD<input id="device" placeholder="전체 Device · 부분 검색"></label><label>Trend<select id="trendGroup"><option value="ld" selected>LD 별 Trend</option><option value="device">Device 별 Trend</option></select></label><label>Min scale<span class="percent-input"><input id="minScale" type="number" min="0" max="99.999999" step="any" placeholder="자동 (99.7)" aria-label="Yield 최소 눈금"><span>%</span></span></label></div><p class="muted">NOTE 기준 목요일~수요일 · 공정별 Out 합계 ÷ In 합계</p><div id="charts" class="weekly-charts"></div></section><section id="lotPanel" hidden><div class="filters"><label>Lot No<input id="lot" placeholder="전체 Lot 번호"></label><button id="find">조회</button></div><h2>Lot 통합 조회</h2><div id="lotResult"></div></section><section id="vmPanel" hidden><div class="filters"><label>From<input id="vmFrom" type="date"></label><label>To<input id="vmTo" type="date"></label><label>Device / PKG Type<input id="vmDevice" placeholder="전체 · 부분 검색"></label><label>Trend<select id="vmGroup"><option value="device">Device 별 Trend</option><option value="pk">PKG Type 별 Trend</option></select></label><label>PKG Type<select id="vmPackage"><option value="">전체 PKG Type</option></select></label></div><p id="vmStatus" role="status"></p><div id="vmCharts" class="grid"></div></section></main><script src="../../shared/auto-mail-client.js?v=100"></script><script type="module" src="app.js?v=110"></script></body></html>
